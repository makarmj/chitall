# Builds and tests Chitall on a GitHub-hosted Mac: the first real compilation of the iOS app
# for a project that is developed on Windows. No signing is needed for the simulator.
name: Build

on:
  push:
    # Documents do not change the app: no Mac minutes for them.
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Core tests on macOS (CryptoKit and Compression paths)
        run: swift test --package-path ChitallCore

      - name: Static project checks
        run: python3 -I tools/check_project.py

      - name: Build and test the app on an iOS simulator
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if "iOS" in k), reverse=True)
          print(next(d["udid"] for k in runtimes for d in devices[k] if d["name"].startswith("iPhone")))
          ')
          echo "Simulator: $UDID"
          xcodebuild test \
            -project Chitall.xcodeproj \
            -scheme Chitall \
            -destination "id=$UDID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log

      - name: Build an unsigned IPA for sideloading (Sideloadly / AltStore sign it)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Chitall.xcodeproj \
            -scheme Chitall \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/ipa" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -5
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/ipa/Build/Products/Release-iphoneos/Chitall.app" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/Chitall.ipa" Payload)
          ls -la Chitall.ipa

      - name: Keep the IPA
        uses: actions/upload-artifact@v7
        with:
          name: Chitall-ipa
          path: Chitall.ipa
          retention-days: 30

      - name: Show failing test messages
        if: failure()
        run: |
          # xcodebuild prints only "failed"; the messages live in the result bundle.
          xcrun xcresulttool get test-results tests --path TestResults.xcresult | python3 -c '
          import json, sys
          def walk(node, path=""):
              name = node.get("name", "")
              if node.get("nodeType") == "Failure Message":
                  print("FAIL", path, "::", name)
              for child in node.get("children", []):
                  walk(child, path + "/" + name if name else path)
          data = json.load(sys.stdin)
          for node in data.get("testNodes", []):
              walk(node)
          ' || true

      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: |
            xcodebuild.log
            TestResults.xcresult
          if-no-files-found: ignore
